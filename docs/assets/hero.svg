<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Learning Machine</title>
  <desc id="desc">Better answers start with better questions. Two modes, one evolving Brief.</desc>
