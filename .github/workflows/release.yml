name: Release assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Match tag to version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import os,pathlib; assert os.environ['RELEASE_TAG'] == 'v' + pathlib.Path('VERSION').read_text().strip(), 'Tag/version mismatch'"
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Attach archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
